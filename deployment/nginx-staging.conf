# nginx server block for POPCORE staging (template).
#
#   1. DNS: an A record for STAGING_HOSTNAME (e.g. staging.popcore.store) -> the droplet.
#   2. cp deployment/nginx-staging.conf /etc/nginx/sites-available/popcore-staging
#      sed -i 's/STAGING_HOSTNAME/staging.popcore.store/g' /etc/nginx/sites-available/popcore-staging
#      ln -s /etc/nginx/sites-available/popcore-staging /etc/nginx/sites-enabled/popcore-staging
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d staging.popcore.store   (adds HTTPS and the HTTP redirect)
#   4. Auth0 SPA application: add https://staging.popcore.store to Allowed Callback URLs,
#      Allowed Logout URLs and Allowed Web Origins.
#
# Staging uses production's Auth0 login and a copy of production's data, so keep it as
# private as production. It is kept out of search engines. While the staging service is
# stopped this answers 503 with a short note instead of a bare 502.

server {
    listen 80;
    server_name STAGING_HOSTNAME;

    client_max_body_size 12m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /uploads/ { return 404; }
    location ^~ /payment_evidence/ { return 404; }
    location ^~ /condition_evidence/ { return 404; }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        error_page 502 504 = @staging_stopped;
    }

    location @staging_stopped {
        default_type text/plain;
        return 503 "POPCORE staging is not running. On the droplet: systemctl start popcore-staging\n";
    }
}
