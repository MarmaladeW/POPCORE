# logrotate config for POPCORE server.log
#
# Installed by setup_production.sh to /etc/logrotate.d/popcore
# (with __REPO_DIR__ replaced by the real path).
#
# logrotate runs daily via the system cron job /etc/cron.daily/logrotate.

__REPO_DIR__/popcore_app/server.log {
    daily           # rotate once per day
    rotate 30       # keep 30 rotated files (~1 month)
    compress        # gzip rotated files
    delaycompress   # compress the previous rotation, not the just-rotated one
                    # (keeps yesterday's log readable without gunzip)
    missingok       # silently skip if the file doesn't exist
    notifempty      # don't rotate empty files
    create 0640 __RUN_USER__ __RUN_USER__   # recreate with correct owner/perms
    postrotate
        # Ask Gunicorn master to reopen log files after rotation.
        # Falls back silently if the service is not running.
        systemctl kill -s USR1 popcore.service 2>/dev/null || true
    endscript
}
