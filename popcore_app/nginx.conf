# nginx reverse-proxy config for POPCORE
#
# SETUP (run once on the Droplet as root):
#
#   1. Install nginx and Certbot:
#        apt update && apt install -y nginx python3-certbot-nginx
#
#   2. Copy this file:
#        cp /home/user/POPCORE/popcore_app/nginx.conf /etc/nginx/sites-available/popcore
#
#   3. Edit the two `server_name` lines below — replace YOUR_DOMAIN with your
#      actual domain (e.g. popcore.example.com). If you're LAN-only with no
#      public domain, use the Droplet's private IP and skip step 4.
#
#   4. Obtain a TLS certificate (requires the domain to point at this Droplet):
#        certbot --nginx -d YOUR_DOMAIN
#      Certbot will update this file automatically with the certificate paths.
#
#   5. Enable the site and reload:
#        ln -sf /etc/nginx/sites-available/popcore /etc/nginx/sites-enabled/popcore
#        nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect all plain-HTTP traffic to HTTPS.
    # Certbot will replace this block when it obtains a certificate.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # --- TLS (Certbot will fill these in) ---
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # --- Gzip (brings the 2.3 MB JS bundle down to ~700 KB) ---
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;
    gzip_min_length 1024;

    # --- Static assets (long cache — filenames are content-hashed by Vite) ---
    location /assets/ {
        alias /home/user/POPCORE/popcore_app/static/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- All other traffic proxied to Gunicorn ---
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # matches gunicorn timeout
    }
}
